<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe3"><meta name="description" content="查看光遇愛麗絲咖啡廳每天的燭光位置，依遊戲換日自動更新。"><title>愛麗絲咖啡廳 · 每日燭光</title>
<style>
:root{color-scheme:light;--ink:#42352f;--orange:#b84720;--muted:#526877}*{box-sizing:border-box}body{margin:0;background:#f5efe3;color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}header,main,footer{max-width:1320px;margin:auto;padding:24px}header{padding-top:36px}.eyebrow{letter-spacing:.18em;font-size:12px;color:#866d54}h1{font-family:Georgia,serif;font-size:clamp(26px,4vw,40px);margin:4px 0 8px}p{margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}button,input{font:inherit}button{cursor:pointer}button,input[type=date]{border:1px solid #cfc2ae;border-radius:9px;background:#fffaf2;color:var(--ink);padding:8px 13px}button:hover{background:#f0e3ca}button:focus-visible,input:focus-visible{outline:3px solid #2878a4;outline-offset:3px}.clock{font-size:14px;color:#716454;margin-top:12px}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;padding-top:0}.map{position:relative;align-self:start;border-radius:14px;overflow:hidden;box-shadow:0 4px 25px #57422d14}.map img{display:block;width:100%}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff8e9;border-radius:50%;width:28px;height:28px;padding:0;background:var(--muted);color:white;font-size:13px;font-weight:750;box-shadow:0 1px 4px #0006;line-height:24px}.pin.on{background:var(--orange)}.pin.on:hover{background:#8c3517}.pin:not(.on):hover{background:#344c5c}.pin.focused{outline:3px solid #26394a;outline-offset:2px;z-index:2}.pin.on::after{content:'';position:absolute;width:6px;height:6px;background:#fff2b8;border-radius:50%;top:-3px;right:-3px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:var(--muted)}.dot.on{background:var(--orange)}aside{align-self:start;position:sticky;top:16px;background:#fffaf3;border:1px solid #e3d8c7;border-radius:14px;padding:20px}h2{font-size:20px;margin:0 0 12px}#detail{background:#eee6d8;padding:12px;border-radius:8px;margin-bottom:18px;min-height:80px}#detail strong{display:block}#detail span,.small{font-size:13px;color:#786956}.locations{display:grid;gap:6px}.locations button{text-align:left;border-color:transparent;background:transparent;padding:6px 8px}.locations button:hover,.locations button.chosen{background:#f2e3cb}.badge{display:inline-block;min-width:26px;color:var(--orange);font-weight:700}footer{font-size:13px;color:#796b5b;padding-top:0}a{color:#486c80}noscript{display:block;padding:24px}@media(max-width:760px){header,main,footer{padding-left:14px;padding-right:14px}main{grid-template-columns:1fr}aside{position:static}.locations{grid-template-columns:1fr 1fr}.pin{width:24px;height:24px;font-size:11px;line-height:20px}.toolbar{gap:7px}.toolbar button{padding:8px 10px}}
</style></head><body><header><div class="eyebrow">SKY · ALICE'S WONDERLAND CAFE</div><h1>愛麗絲咖啡廳 · 每日燭光</h1><p>今天的光，藏在哪裡？點選地圖編號，找到每天的 12 處燭光。</p>
<div class="toolbar"><button id="prev" aria-label="前一天">←</button><label for="date">遊戲日期</label><input type="date" id="date" min="2025-01-01" max="2099-12-31"><button id="next" aria-label="後一天">→</button><button id="today">回到今天</button><span id="mode"></span></div><div class="clock" id="clock" role="timer"></div><div class="legend"><span><i class="dot on"></i>當日有燭光</span><span><i class="dot"></i>當日沒有燭光</span></div></header>
<noscript>請啟用 JavaScript，以查看日期與當日燭光位置。</noscript><main><div class="map" id="map"><img src="__IMAGE__" alt="愛麗絲咖啡廳地圖，由 @sky_solsuga 繪製，附每日燭光位置標記" width="2480" height="3508" style="height:auto"></div><aside><h2 id="list-title">當日燭光 · 12 處</h2><div id="detail" aria-live="polite">點選編號查看地點。</div><div id="locations" class="locations"></div></aside></main>
<footer><p>依美國太平洋時間午夜換日，自動調整夏令時間。台灣時間為夏季 15:00、冬季 16:00。日期與倒數使用裝置時間。</p><p>地圖：@sky_solsuga（2025-01-05）／<a href="https://sky-children-of-the-light.fandom.com/wiki/Map:Alice%27s_Wonderland_Cafe" target="_blank" rel="noreferrer">Sky Wiki 原圖與授權資訊</a>。本頁加上編號與每日顏色標示；原圖的活動票券圖示不代表目前活動。</p><p>非官方玩家工具。地點可能隨遊戲更新調整。</p></footer>
<script>
__CORE__
const points=__POINTS__;
const dateInput=document.getElementById('date'),map=document.getElementById('map');
let followToday=true,selected=new Set(),focused=null,lastToday='',resetAt=null;
for(const p of points){const b=document.createElement('button');b.className='pin';b.textContent=p.id;b.style.left=`${p.u*100}%`;b.style.top=`${p.v*100}%`;b.dataset.id=p.id;b.onclick=()=>focusPoint(p.id);map.append(b);}
function focusPoint(id){focused=id;const p=points.find(p=>p.id===id);const detail=document.getElementById('detail');detail.replaceChildren();const strong=document.createElement('strong');strong.textContent=`${id} · ${p.name}`;const status=document.createElement('span');status.textContent=selected.has(id)?'當日有燭光':'當日沒有燭光';detail.append(strong,status);document.querySelectorAll('.pin').forEach(b=>{b.classList.toggle('focused',Number(b.dataset.id)===id);b.setAttribute('aria-pressed',String(Number(b.dataset.id)===id));});document.querySelectorAll('.locations button').forEach(b=>b.classList.toggle('chosen',Number(b.dataset.id)===id));}
function render(){selected=new Set(selectedForDate(dateInput.value));document.getElementById('mode').textContent=followToday?'今天 · 自動更新':'查看指定日期';document.querySelectorAll('.pin').forEach(b=>{const p=points.find(p=>p.id===Number(b.dataset.id));const on=selected.has(p.id);b.classList.toggle('on',on);b.title=`${p.id} · ${p.name} · ${on?'有燭光':'沒有燭光'}`;b.setAttribute('aria-label',b.title);});const list=document.getElementById('locations');list.replaceChildren();for(const p of points.filter(p=>selected.has(p.id))){const b=document.createElement('button');b.dataset.id=p.id;const n=document.createElement('span');n.className='badge';n.textContent=p.id;b.append(n,document.createTextNode(p.name));b.onclick=()=>focusPoint(p.id);list.append(b);}focusPoint(focused??[...selected][0]);document.getElementById('prev').disabled=dateInput.value<=dateInput.min;document.getElementById('next').disabled=dateInput.value>=dateInput.max;}
function tick(){const now=new Date(),today=gameDate(now);if(today!==lastToday){lastToday=today;resetAt=nextReset(now);if(followToday){dateInput.value=today;render();}}if(!resetAt||resetAt<=now)resetAt=nextReset(now);let seconds=Math.max(0,Math.ceil((resetAt-now)/1000));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;document.getElementById('clock').textContent=`距離下次換日 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} · 當地時間 ${resetAt.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`;}
function shift(delta){const d=new Date(dateInput.value+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+delta);dateInput.value=d.toISOString().slice(0,10);followToday=false;render();}
document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);document.getElementById('today').onclick=()=>{followToday=true;dateInput.value=gameDate();render();tick();};dateInput.onchange=()=>{if(!dateInput.value||!dateInput.checkValidity()){dateInput.value=lastToday;followToday=true;}else followToday=false;render();};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('focus',tick);tick();setInterval(tick,1000);
</script></body></html>
